name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Two forms of tag and no other (RELEASING.md, "The two lines and the direction rule"):
      # vX.Y.Z, a stable release, cut from main; vX.Y.Z-beta.N, a prerelease, cut from beta.
      # Any other form (-rc.1, -alpha, a build suffix) is refused before anything is published.
      - name: Check the tag's form, the version and the tag's line
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            if [ -n "${BASH_REMATCH[4]}" ]; then line=beta; else line=main; fi
          else
            echo "::error::tag ${GITHUB_REF_NAME} is neither vX.Y.Z (cut from main) nor vX.Y.Z-beta.N (cut from beta); no other form is released"
            exit 1
          fi
          python3 scripts/check-release-version.py
          git fetch --no-tags origin "+refs/heads/${line}:refs/remotes/origin/${line}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${line}"; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on ${line}: a stable tag is cut from main, a prerelease tag from beta"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is on ${line}"

  # ci.yml's workflow_call runs its two jobs, lint and checks, in full (a tag
  # is no push to a line; its beta-born and main-in-beta jobs read a pull request
  # or a push to beta and do not run). checks reads pull requests and check runs
  # on a push to a line, so the call grants both, read only.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read

  engine:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run -p bsv-overlay-engine
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish -p bsv-overlay-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-engine "${GITHUB_REF_NAME#v}"

  discovery:
    needs: [version, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run -p bsv-overlay-discovery
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish -p bsv-overlay-discovery
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-discovery "${GITHUB_REF_NAME#v}"

  replay:
    needs: [version, discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run --manifest-path workers/Cargo.toml -p bsv-low-proof-replay
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --manifest-path workers/Cargo.toml -p bsv-low-proof-replay
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-low-proof-replay "${GITHUB_REF_NAME#v}"

  build-info:
    needs: [version, replay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run --manifest-path workers/Cargo.toml -p bsv-worker-build-info
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --manifest-path workers/Cargo.toml -p bsv-worker-build-info
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-worker-build-info "${GITHUB_REF_NAME#v}"

  cloudflare:
    needs: [version, build-info]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run --manifest-path workers/Cargo.toml -p bsv-overlay-cloudflare
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --manifest-path workers/Cargo.toml -p bsv-overlay-cloudflare
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-cloudflare "${GITHUB_REF_NAME#v}"
