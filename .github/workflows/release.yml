name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        run: |
          python3 scripts/check-release-version.py
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # L2-gate provides workflow_call with test, fmt, clippy and wasm32 jobs.
  # Land the callable gate together with this workflow before any v* tag.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  engine:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run -p bsv-overlay-engine
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish -p bsv-overlay-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-engine "${GITHUB_REF_NAME#v}"

  discovery:
    needs: [version, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run -p bsv-overlay-discovery
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish -p bsv-overlay-discovery
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-discovery "${GITHUB_REF_NAME#v}"

  replay:
    needs: [version, discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run --manifest-path workers/Cargo.toml -p low-proof-replay
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --manifest-path workers/Cargo.toml -p low-proof-replay
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh low-proof-replay "${GITHUB_REF_NAME#v}"

  cloudflare:
    needs: [version, replay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run --manifest-path workers/Cargo.toml -p bsv-overlay-cloudflare
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --manifest-path workers/Cargo.toml -p bsv-overlay-cloudflare
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for registry index
        run: bash scripts/wait-crate-index.sh bsv-overlay-cloudflare "${GITHUB_REF_NAME#v}"
