# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo.
# Host clippy covers all targets; wasm clippy covers libraries because SQLite dev tests are native.
# The lint bar (bsv-stack-lean #137 to #145) adds machete (non-blocking), msrv, secrets, docs and
# actionlint; the protection requires test, fmt, clippy and wasm32 until the keeper adds them.
# Every action is pinned by commit sha.
name: ci
'on':
  pull_request: null
  # the release workflow calls these jobs on a v* tag (release.yml)
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    - run: bash scripts/check-config-ids.sh --self-test
    - run: bash scripts/check-config-ids.sh
    - run: python3 scripts/check-storage-ownership.py --self-test
    - run: python3 scripts/check-storage-ownership.py
    - run: bash scripts/check-workspaces.sh
    - run: cargo test --workspace --features bsv-overlay-engine/memory-storage --no-fail-fast
    - run: cargo test --manifest-path workers/Cargo.toml --workspace --no-fail-fast
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    - run: cargo fmt --all -- --check
    # Workers workspace formatting belongs to the separate K1 hygiene commit.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    - run: cargo clippy --workspace --all-targets --features bsv-overlay-engine/memory-storage -- -D warnings
    - run: cargo clippy --manifest-path workers/Cargo.toml --workspace --all-targets -- -D warnings
    - run: cargo clippy -p bsv-overlay-engine -p bsv-overlay-discovery --target wasm32-unknown-unknown --lib --
        -D warnings
    - run: cargo clippy --manifest-path workers/Cargo.toml --workspace --target wasm32-unknown-unknown --lib --
        -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    - run: cargo build -p bsv-overlay-engine -p bsv-overlay-discovery --release --target wasm32-unknown-unknown
        --lib
    - run: cargo build --manifest-path workers/Cargo.toml --workspace --release --target wasm32-unknown-unknown
        --lib
  machete:
    name: machete
    runs-on: ubuntu-latest
    # Unused dependencies (bsv-stack-lean #137): non-blocking until the keeper
    # names it a required context.
    continue-on-error: true
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
    - run: cargo install cargo-machete --version 0.9.2 --locked --root "$RUNNER_TEMP/tools"
    - run: '"$RUNNER_TEMP/tools/bin/cargo-machete" --with-metadata .'
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.88.0
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    # The MSRV checked (bsv-stack-lean #139): the declaration is the toolchain
    # above, and every target of both workspaces checks at it.
    - run: grep -qx 'rust-version = "1.88"' Cargo.toml && grep -qx 'rust-version = "1.88"' workers/Cargo.toml
    - run: cargo check --locked --workspace --all-targets --features bsv-overlay-engine/memory-storage
    - run: cargo check --locked --manifest-path workers/Cargo.toml --workspace --all-targets
    - run: cargo check --locked -p bsv-overlay-engine -p bsv-overlay-discovery --target wasm32-unknown-unknown
        --lib
    - run: cargo check --locked --manifest-path workers/Cargo.toml --workspace --target wasm32-unknown-unknown
        --lib
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        persist-credentials: false
    # The secrets scan (bsv-stack-lean #140): gitleaks 8.28.0 built from its
    # release source, refused unless the tarball's sha256 is the one Homebrew's
    # formula pins; the runner's Go builds it, go.sum checks its modules.
    - name: gitleaks 8.28.0
      env:
        GITLEAKS_VERSION: 8.28.0
        GITLEAKS_SHA256: c681af8aeacacf9d14f7ad97d534cf087f6d2d6fbd50dd02020b0f929b7a1c41
      run: |
        curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}" && go build -o "$RUNNER_TEMP/gitleaks" .
    # Every commit of the history and the tree, findings redacted; the
    # allowlist is .gitleaks.toml's.
    - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
    - run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .'
  docs:
    name: docs
    runs-on: ubuntu-latest
    # Doc warnings denied (bsv-stack-lean #141): both workspaces, the root
    # one with and without the test-store feature (docs.rs builds without).
    # low-app-layer is LOW's crate: its own doc warnings are LOW's to fix.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: 1.95.0
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target

          workers -> workers/target'
    - run: cargo doc --locked --no-deps --workspace
    - run: cargo doc --locked --no-deps --workspace --features bsv-overlay-engine/memory-storage
    - run: cargo doc --locked --no-deps --manifest-path workers/Cargo.toml --workspace --exclude low-app-layer
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # actionlint on every workflow (bsv-stack-lean #145): 1.7.12 built from its
    # release source, refused unless the tarball's sha256 is the one Homebrew's
    # formula pins; shellcheck on the runner checks the run scripts.
    - name: actionlint 1.7.12
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 454800bd4f854592bcfe79b161f71d56e35940eb7016e48a26dd356adc9d400a
      run: |
        curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/archive/refs/tags/v${ACTIONLINT_VERSION}.tar.gz"
        echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}" && go build -o "$RUNNER_TEMP/actionlint" ./cmd/actionlint
    - run: '"$RUNNER_TEMP/actionlint"'
  # One bsv-rs per lock (bsv-stack-lean #182): a committed Cargo.lock holding
  # two bsv-rs entries fails, the gate a self-merging stack PR stands behind.
  locks:
    name: locks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: One bsv-rs per committed Cargo.lock
      run: |
        set -euo pipefail
        status=0
        found=0
        while IFS= read -r -d '' lock; do
          found=$((found + 1))
          n=$(grep -c '^name = "bsv-rs"$' "$lock" || true)
          echo "$lock: $n bsv-rs"
          if [ "$n" -gt 1 ]; then
            echo "::error file=$lock::$n bsv-rs entries; one bsv-rs per lock"
            status=1
          fi
        done < <(git ls-files -z -- 'Cargo.lock' '*/Cargo.lock')
        [ "$found" -gt 0 ] || echo "no committed Cargo.lock"
        exit "$status"
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - run: tools/scrub.sh
