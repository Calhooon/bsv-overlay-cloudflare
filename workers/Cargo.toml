# The LOW workers' workspace (bsv-low #553, 2026-10-06): the two deployable
# workers and the `LOW/proof/v1` replay they share. These three crates link
# `low-core` and `low-wire`: since 2026-10-09 from crates.io (`bsv-low-core`,
# `bsv-low-wire`, published from the private `bsv-low`, pinned by exact
# version in `crates/low-proof-replay`); before that by PATH from the sister
# checkout, which is why these three are a workspace of their own and not
# members of the root one (that one is what a consumer pins by git rev). The
# engine crates are path dependencies of these, never the reverse.
#
# A virtual manifest, so neither worker owns the other. Each member names it
# with `package.workspace`. ONE `Cargo.lock` (`workers/Cargo.lock`) serves
# all three deployable wrangler configs, and it may hold exactly ONE `worker`
# version (bsv-low #348; `make ci-deploy` checks this lock).
#
#   cargo test --manifest-path workers/Cargo.toml --workspace
[workspace]
members = [
    "../crates/overlay-cloudflare",
    "../crates/low-app-layer",
    "../crates/low-proof-replay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-overlay-cloudflare"

# Mirrors the root `Cargo.toml` table (a workspace cannot inherit another's):
# change a version in both. `make ci-deploy` refuses a difference
# (`scripts/check-workspaces.sh`).
[workspace.dependencies]
# BSV SDK: crates.io. `overlay` feature = types + transaction + script +
# wallet. `auth`/`http` deliberately left off; they pull reqwest/tokio-net
# which fail on wasm32.
bsv-rs = { version = "=0.4.3", features = ["overlay"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
hex = "0.4"
tracing = "0.1"

# bsv-middleware-cloudflare: the registry release, no `[patch]` (bsv-low #577,
# 2026-10-08). The session lane rode a git rev here from bsv-low #441 (0.3.4,
# `session-lane`) to #493 (0.3.5, rev 9394c74) until 0.3.7 folded that branch into
# main; the members ask "0.3" and the lock holds 0.3.8 (main c39642f, which wires
# `verify_brc29_payment_output` into the middleware's own payment path). Never 0.3.7.
# Since bsv-low #588 (2026-10-09) both workers crates pinned `=0.4.1` (with `bsv-middleware-core` 0.1.0, on bsv-rs 0.3).
# Since align-engine-050 (2026-10-10) both pin `=0.5.0`, so the lock holds ONE middleware (0.5.0) beside
# `bsv-middleware-core` 0.2.0, both on bsv-rs 0.4: one bsv-rs (the `=0.4.3` above) in the lock.
