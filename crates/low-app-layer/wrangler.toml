# low-app-layer — LOW's browser-facing READ surface for chain facts
# (bsv-low: the game client must stop reading WhatsOnChain).
#
# Serves /utxo-status, /beef/:txid, /tip, /health straight from the
# low-overlay's D1 database (the same `low-overlay-db` the low-overlay
# worker writes) plus the rust-chaintracks service binding for the tip.
# STRICTLY READ-ONLY: this worker never writes to the DB — the overlay
# owns the schema and every mutation. Deploy with:
#
#   npx wrangler deploy   # from crates/low-app-layer/
#
# account_id comes from the CLOUDFLARE_ACCOUNT_ID environment variable.
#
# Secrets (bsv-low #318): ONE optional secret, `SERVER_PRIVATE_KEY` — the
# worker's dedicated BRC-103/104 server identity (64-hex secp256k1 key,
# DISTINCT from every other key in the system; set via
# `npx wrangler secret put SERVER_PRIVATE_KEY`). Without it the front door
# runs lenient-only (anonymous reads serve; auth-attempting requests get an
# honest 503). Every route still serves public chain facts — auth binds
# IDENTITY (and readies BRC-105 quota), it does not add confidentiality.

name = "low-app-layer"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# worker-build ^0.8 — this crate pins worker 0.8 (required by
# bsv-middleware-cloudflare 0.3, the canonical BRC-103/104 middleware). Since
# bsv-low #348 the WHOLE workspace is on worker 0.8, and it has to be:
# worker-build's version gate reads the workspace Cargo.lock and picks the
# lowest `worker` in it, so a second major anywhere in the workspace makes
# whichever crate wants the higher one silently undeployable (only at deploy
# time — `cargo build` does not care). Keep this pin in lockstep with
# ../overlay-cloudflare/wrangler.toml and wrangler.low.toml.
command = "cargo install -q --version ^0.8 worker-build && worker-build --release"

# #318 — the lenient→strict enforcement flip. "false" (or unset) = LENIENT:
# unauthenticated reads serve exactly as pre-#318 but are counted on /health
# (`anonymousByRoute` per identity route + `publicServed`). "true" = STRICT:
# the FIVE identity-scoped reads (/results, /refund-view, /live-view,
# /recovery-view, /hops-view) require auth; every OTHER route stays PUBLIC and
# is never refused (deliberate exemption — the overlay /lookup already serves
# that data unauthenticated; /health included so liveness monitors survive the
# flip). Ordering matters: set SERVER_PRIVATE_KEY + create AUTH_SESSIONS
# BEFORE shipping the auth-enabled client (AuthFetch always handshakes, so an
# auth client vs an unconfigured worker 503s), THEN ship + soak
# (`anonymousByRoute` ≈ 0 for every identity route), THEN flip. Rollback is
# flipping it back; no code change. Full closure criteria: `src/auth.rs` docs.
[vars]
AUTH_ENFORCE = "false"
# The relay this worker pushes events to (its /broadcast rooms + /push boxes),
# reached through the RELAY service binding; the URL names the path/host the
# relay sees. Pushes no-op without the BROADCAST_TOKEN secret.
RELAY_URL = "https://low-relay.dev-a3e.workers.dev"

# Storage epoch (bsv-low THE ORDER item 2, owner-ruled 2026-08-06): served
# verbatim by `GET /epoch` as {"storageEpoch": "<value>"}. BUMPING THIS VALUE
# ORDERS EVERY CLIENT TO CLEAR ITS LOCAL low_* STATE AT ITS NEXT IDLE HOME
# VISIT (bsv-low app/src/lib/storageEpoch.ts — live hands are guarded, the
# cosmetic allowlist survives). Unset/empty serves {"storageEpoch": null},
# which the client treats as "no wipe directive" (fail-safe).
STORAGE_EPOCH = "2026-08-06-zero-world-1"

# #375 pre-launch era write-off cutoff (owner-ruled 2026-08-07), ms since
# epoch. When set, every money-listing view (/pots-view /recovery-view
# /results /refund-view /hops-view /live-view /leaderboard) DROPS rows whose
# server-written admission anchor pre-dates it, and `GET /epoch` serves it as
# {"writtenOffBeforeMs": <n>} for the client half (bsv-low
# app/src/lib/writtenOffEra.ts). Empty/unset/malformed = INERT (every query
# byte-identical to the unconfigured build). RULES FOR THE VALUE: it must be
# IN THE PAST (a cutoff at/after now is refused at read time and warned —
# the future-cutoff belt) and MUST PRE-DATE LAUNCH — that is the entire
# fairness argument; bump it to launch-eve as a LAUNCH-RUNBOOK step. Choose
# a second-aligned instant with margin (anchors are unix seconds; a
# mid-second cutoff can drop up to ~1s of post-cutoff admissions). /health
# echoes the ACTIVE (post-belt) value — check it after every change.
WRITTEN_OFF_BEFORE_MS = "1786152389000"

# #375 companion (review H1): the write-off cutoff as a BLOCK HEIGHT — served
# verbatim on /epoch as {"writtenOffBeforeHeight": <n>}, never used in SQL
# here. CLIENT-PROTECTIVE ONLY: a record whose own recovery/lock height
# reaches this height is CURRENT-era no matter what its wall-clock stamps say
# (a backdated client clock cannot fake a chain height), and the client
# tip-sanes its seeding gate against it. Set it TOGETHER with the ms cutoff:
# the chain tip at (or just before) the same activation instant. Empty/unset
# = no rescue belt (stamps alone decide — the pre-#375 posture).
WRITTEN_OFF_BEFORE_HEIGHT = "961353"

# BRC-103/104 session store for the auth middleware (`process_auth`'s
# `AUTH_SESSIONS` binding — same shape the low-watchtower uses). id is a
# placeholder by repo convention — the real namespace id is injected at
# deploy time and never committed (create once with
# `npx wrangler kv namespace create AUTH_SESSIONS`).
[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "022b3f903b7449c0bedf3e3eb8033cc4"  # local deploy id — do not commit

# The SAME D1 database the low-overlay worker writes (wrangler.low.toml uses
# the identical binding name + database_name). This worker only ever SELECTs
# from it. database_id is a placeholder by repo convention — the real id is
# injected at deploy time and never committed.
[[d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db"
database_id = "9930afce-6154-4d1e-b2a0-71a90065db0a"  # local deploy id — do not commit

# Service binding to the ChainTracks worker (same account). /tip uses this to
# resolve the present chain height: a plain workers.dev URL fetch to a
# same-account worker loops back to this worker (returns our own 404), so the
# binding is required for the fetch to reach ChainTracks. `service` is a
# worker name, not a secret.
[[services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# Service binding to the LOW watchtower worker (same account). /live-view
# uses this for its BOUNDED case fan-out: the tower's PUBLIC no-auth
# `GET /case/:gameId` view, at most LIVE_VIEW_CASE_FANOUT_CAP (8) fetches
# per request, each raced against a per-fetch timeout — any fault only
# degrades that row's `case` to null, never the route. `service` is a
# worker name, not a secret.
[[services]]
binding = "TOWER"
service = "low-watchtower"

# Service binding to the LOW relay (same account) for `/broadcast` (the lobby /
# leaderboard / tip rooms) and `/push` (per-seat `low_events` boxes). REQUIRED:
# Cloudflare refuses a plain fetch between two Workers on one zone (error 1042
# behind a 404), and every *.workers.dev host of an account is ONE zone —
# proven on beta 2026-09-03. `service` is a worker name, not a secret.
[[services]]
binding = "RELAY"
service = "low-relay"

# ══════════════════════════════════════════════════════════════════════════
# beta — the ISOLATED pre-release stack (bsv-low, 2026-08-12)
#
#   npx wrangler deploy --env beta
#
# Reads the BETA overlay's D1, so beta money views are built from beta rows
# only and the whole environment can be wiped without touching prod. This
# worker needs no topic-suffix awareness of its own: it never calls the
# overlay and never filters on a `topic` column — the per-protocol tables it
# reads (pot_records, potparty_records, result_markers_v2, …) are per-topic by
# construction, so the database binding IS the isolation.
#
# ORDER MATTERS on a fresh beta D1: deploy + warm the BETA OVERLAY first (it
# owns the schema). This worker only ALTERs/CREATEs a few latch columns and
# two tables; against a database whose base tables don't exist yet those
# statements fail as not-benign, so the migration latch never sets and every
# request re-issues them until the overlay has run once.
#
# NOTHING is inherited from the blocks above — wrangler env sections do not
# inherit vars, d1_databases, kv_namespaces or services. Every binding this
# worker reads is redeclared here on purpose.
# ══════════════════════════════════════════════════════════════════════════

[durable_objects]
bindings = [{ name = "BOARD_VIEW", class_name = "BoardView" }]

[[migrations]]
tag = "v2-boardview"
new_classes = ["BoardView"]

[env.beta]
name = "low-app-layer-beta"

[env.beta.vars]
RELAY_URL = "https://low-relay-beta.dev-a3e.workers.dev"
AUTH_ENFORCE = "false"
# Beta's own storage epoch — bumping THIS orders beta clients to clear their
# local state without touching prod clients.
STORAGE_EPOCH = "beta-2026-08-12-1"
# 2026-08-27 — SET (the rehearsal the note below anticipated): beta's own
# campaign history crossed the 500-pot leaderboard window (BOARD_CLAIM_LIMIT),
# so every board page returned truncated:true and every client fell back to
# the slow gather (layer 10 of the enforced-board onion; decision log
# addendum 21). Cutoff = 2026-08-27 00:00 UTC / first block past midnight
# (964063 @ 00:12:31Z) — retires the pre-today era from every view while the
# day's live cells keep serving. Bump forward the same way whenever beta's
# window re-fills; the durable fix is board paging (#403 item 4).
# (Original stance, kept for the why of the mechanism: the #375 era write-off
# retires a pre-launch era; wiping beta wholesale is a DELETE, not a cutoff.)
WRITTEN_OFF_BEFORE_MS = "1787788800000"
WRITTEN_OFF_BEFORE_HEIGHT = "964063"

# Beta's OWN session store. AUTH_SESSIONS and SERVER_PRIVATE_KEY are all-or-
# nothing: the front door computes `configured = key AND kv`, and an
# auth-attempting client against a half-configured worker gets 503 on EVERY
# route — including /health — because the handshake is judged before route
# exemptions. Set both, or neither.
[[env.beta.kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "0f329fae1869418ea9c85dfc6fbd4ca4"  # low-app-layer-beta-AUTH_SESSIONS

[[env.beta.d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db-beta"
database_id = "49d4ecb7-5f4d-4ba5-b149-2939ca7262c3"

[[env.beta.services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# The BETA tower. Binding prod's here would let prod case answers bleed into
# beta rows: the fan-out is by gameId and the case↔pot binding is explicitly
# not verified. Absence would be safe (case: null); prod would not be.
[[env.beta.services]]
binding = "TOWER"
service = "low-watchtower-beta"

# The BETA relay (see the prod RELAY binding for the why).
[[env.beta.services]]
binding = "RELAY"
service = "low-relay-beta"

[env.beta.durable_objects]
bindings = [{ name = "BOARD_VIEW", class_name = "BoardView" }]
