# low-app-layer — LOW's browser-facing READ surface for chain facts
# (bsv-low: the game client must stop reading WhatsOnChain).
#
# Serves /utxo-status, /beef/:txid, /tip, /health straight from the
# low-overlay's D1 database (the same `low-overlay-db` the low-overlay
# worker writes) plus the rust-chaintracks service binding for the tip.
# It is NOT read-only (bsv-low #474): its write set is listed at the
# `d1_databases` block below and in docs/STORAGE-OWNERSHIP.md. Deploy with:
#
#   npx wrangler deploy   # from crates/low-app-layer/
#
# account_id comes from the CLOUDFLARE_ACCOUNT_ID environment variable.
#
# Secrets (bsv-low #318): ONE optional secret, `SERVER_PRIVATE_KEY` — the
# worker's dedicated BRC-103/104 server identity (64-hex secp256k1 key,
# DISTINCT from every other key in the system; set via
# `npx wrangler secret put SERVER_PRIVATE_KEY`). Without it the front door
# runs lenient-only (anonymous reads serve; auth-attempting requests get an
# honest 503). Every route still serves public chain facts — auth binds
# IDENTITY (and readies BRC-105 quota), it does not add confidentiality.

name = "low-app-layer"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# worker-build ^0.8 — this crate pins worker 0.8 (required by
# bsv-middleware-cloudflare 0.3, the canonical BRC-103/104 middleware). Since
# bsv-low #348 the WHOLE workspace is on worker 0.8, and it has to be:
# worker-build's version gate reads the workspace Cargo.lock and picks the
# lowest `worker` in it, so a second major anywhere in the workspace makes
# whichever crate wants the higher one silently undeployable (only at deploy
# time — `cargo build` does not care). Keep this pin in lockstep with
# ../overlay-cloudflare/wrangler.toml and wrangler.low.toml.
command = "cargo install -q --version ^0.8 worker-build && worker-build --release"

# #318 — the lenient→strict enforcement flip. "false" (or unset) = LENIENT:
# unauthenticated reads serve exactly as pre-#318 but are counted on /health
# (`anonymousByRoute` per identity route + `publicServed`). "true" = STRICT:
# the FIVE identity-scoped reads (/results, /refund-view, /live-view,
# /recovery-view, /hops-view) require auth; every OTHER route stays PUBLIC and
# is never refused (deliberate exemption — the overlay /lookup already serves
# that data unauthenticated; /health included so liveness monitors survive the
# flip). Ordering matters: set SERVER_PRIVATE_KEY + create AUTH_SESSIONS
# BEFORE shipping the auth-enabled client (AuthFetch always handshakes, so an
# auth client vs an unconfigured worker 503s), THEN ship + soak
# (`anonymousByRoute` ≈ 0 for every identity route), THEN flip. Rollback is
# flipping it back; no code change. Full closure criteria: `src/auth.rs` docs.
# Hostnames are `__HOST_<NAME>__` placeholders (bsv-low RENDER-HOSTNAMES, record 926): a bare hostname each, injected
# BY NAME at deploy by bsv-low's scripts/runner/patterns/render-wrangler.sh beside the `__LOW_..._ID__` ids; a name it
# does not know refuses the render, so a literal `__HOST_` never reaches a deployed [vars].
[vars]
# bsv-low #912 (D2-ACTOR-B): Phase B's read flag (the actor's rows served) and Phase C's (the D1 judge off). Off and
# on until E4: Phase A, the actor applies beside the D1 judge and its rows are compared.
OWED_ACTOR_READ = "false"
OWED_D1_JUDGE = "true"
# D2-ACTOR-D (bsv-low #952): the `owed-events` consumer's concurrency, the cutover doc's knob: "1" while the D1 judge
# writes `owed_rows` (Phases A and B: two consumers judging one identity's games are two D1 writers); Phase C (the
# actor the one writer, each identity serialised by its own Durable Object) may raise it, moved WITH the consumer's
# `max_concurrency` below (pinned equal; the consumer names a value above 1 while `OWED_D1_JUDGE` is on, every batch).
OWED_CONSUMER_CONCURRENCY = "1"
AUTH_ENFORCE = "true"  # the promotion 2026-09-21: the identity reads enforced (C6), as proven on beta
# bsv-low #441: the session lane (one BRC-103 handshake per origin, then a MAC'd lane
# on `x-low-session*`); the store binding must exist for the flag to mean anything
# (`session_lane_configured`). ON on prod since bsv-low #773 (2026-10-20): beta has run
# the lane since 2026-09-14 (D12); prod stayed off by this block alone, so every signed
# app-layer read on prod paid a BRC-104 wallet signature and the relay legs R1/R2
# could not pass there (record 817). The AUTH_SESSION_STORE DO is bound below.
SESSION_LANE = "true"
# The relay this worker pushes events to (its /broadcast rooms + /push boxes),
# reached through the RELAY service binding; the URL names the path/host the
# relay sees. Pushes no-op without the BROADCAST_TOKEN secret.
RELAY_URL = "https://__HOST_RELAY__"
# bsv-low loop 6: the path the OVERLAY binding sees for the block-event pass. Not a secret.
OVERLAY_URL = "https://__HOST_OVERLAY__"
# bsv-low #451 slice B: the Arcade endpoint `/tx-any` asks FIRST for a tx the index holds without a verified bump
# (our broadcaster's live word is the network witness; the couriers only when it does not know). Not a secret.
ARCADE_URL = "https://arcade-v2-us-1.bsvblockchain.tech"
# bsv-low #532: the URL the IDENTITY binding (LOW's identity resolver) is asked for the identity views (any host:
# over the binding only the path counts; the prod resolver has no workers.dev host), and the app origins those
# views answer CORS to (comma separated, exact; unset = none; never localhost here, pinned). Not secrets.
IDENTITY_URL = "https://__HOST_IDENTITY_RESOLVER__"
IDENTITY_APP_ORIGINS = "https://bsvarcade.com,https://www.bsvarcade.com,https://__HOST_PAGES_PROD__"

# Storage epoch (bsv-low THE ORDER item 2, owner-ruled 2026-08-06): served
# verbatim by `GET /epoch` as {"storageEpoch": "<value>"}. BUMPING THIS VALUE
# ORDERS EVERY CLIENT TO CLEAR ITS LOCAL low_* STATE AT ITS NEXT IDLE HOME
# VISIT (bsv-low app/src/lib/storageEpoch.ts — live hands are guarded, the
# cosmetic allowlist survives). Unset/empty serves {"storageEpoch": null},
# which the client treats as "no wipe directive" (fail-safe).
STORAGE_EPOCH = "2026-08-06-zero-world-1"

# #375 pre-launch era write-off cutoff (owner-ruled 2026-08-07), ms since
# epoch. When set, every money-listing view (/pots-view /recovery-view
# /results /refund-view /hops-view /live-view /leaderboard) DROPS rows whose
# server-written admission anchor pre-dates it, and `GET /epoch` serves it as
# {"writtenOffBeforeMs": <n>} for the client half (bsv-low
# app/src/lib/writtenOffEra.ts). Empty/unset/malformed = INERT (every query
# byte-identical to the unconfigured build). RULES FOR THE VALUE: it must be
# IN THE PAST (a cutoff at/after now is refused at read time and warned —
# the future-cutoff belt) and MUST PRE-DATE LAUNCH — that is the entire
# fairness argument; bump it to launch-eve as a LAUNCH-RUNBOOK step. Choose
# a second-aligned instant with margin (anchors are unix seconds; a
# mid-second cutoff can drop up to ~1s of post-cutoff admissions). /health
# echoes the ACTIVE (post-belt) value — check it after every change.
# 2026-09-21 (the M21 promotion, step 8): the prod era cutoff bumped to the activation instant 2026-09-21T13:44:27Z / tip 967732
# (every pre-promotion hand written off from every view; prod held zero unspent pots in any era, the two stranded hops were our e2e wallet's).
WRITTEN_OFF_BEFORE_MS = "1789998267000"

# #375 companion (review H1): the write-off cutoff as a BLOCK HEIGHT — served
# verbatim on /epoch as {"writtenOffBeforeHeight": <n>}, never used in SQL
# here. CLIENT-PROTECTIVE ONLY: a record whose own recovery/lock height
# reaches this height is CURRENT-era no matter what its wall-clock stamps say
# (a backdated client clock cannot fake a chain height), and the client
# tip-sanes its seeding gate against it. Set it TOGETHER with the ms cutoff:
# the chain tip at (or just before) the same activation instant. Empty/unset
# = no rescue belt (stamps alone decide — the pre-#375 posture).
WRITTEN_OFF_BEFORE_HEIGHT = "967732"

# bsv-low #862 (L7-DEPTH): the host's SPEND DEPTH, the confirmations a wallet needs before it credits a coin on a
# served chain word (R3 of the wallet charter), served as `spendDepth` beside `tracker` on /tx-any and beside `lock`
# on /utxo-status and /spent-any, and on /health.spendDepth. An integer, 1 the floor; missing or malformed serves 1
# and counts spend_depth_var_malformed_total once per isolate. The value at risk per R3(b) is the owner's later word.
SPEND_DEPTH = "1"

# BRC-103/104 session store for the auth middleware (`process_auth`'s
# `AUTH_SESSIONS` binding — same shape the low-watchtower uses). id is a
# placeholder by repo convention — the real namespace id is injected at
# deploy time and never committed (create once with
# `npx wrangler kv namespace create AUTH_SESSIONS`).
[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "__LOW_APPLAYER_DEFAULT_KV_AUTH_SESSIONS_ID__"  # injected at deploy time from the private secrets store by name

# The SAME D1 database the low-overlay worker writes (wrangler.low.toml uses
# the identical binding name + database_name). database_id is a placeholder by
# repo convention, the real id injected at deploy time and never committed.
#
# Ownership (bsv-low #474; the manifest is storage-ownership.json, the prose
# docs/STORAGE-OWNERSHIP.md, and `make ci` refuses any statement it does not
# grant). The overlay owns the schema and 50 of the 55 tables. This worker:
#   OWNS hopsweep_records, proof_posts, owed_rows, owed_state, hop_chain_probes,
#     handfile_batches, handfile_rows (bsv-low #848)
#   WRITES INSERT potparty_records, hopparty_records (#848, the handfile's
#     exploded hop rows); INSERT, UPDATE potrefund_records;
#     INSERT hopsweep_records, handfile_batches, handfile_rows,
#     result_markers_v2, collected_markers_v2,
#     proof_posts, lb_marker_rows, tx_any_verdicts, hop_chain_probes,
#     ops_counters; INSERT, DELETE owed_rows; INSERT, UPDATE owed_state;
#     UPDATE board_era (#674, the cutoff: the scheduled pass's stamp)
#   CATCH-UP DDL (schema.rs, each byte-identical to an overlay migration):
#     ALTER pot_records, potparty_records, hopparty_records,
#     result_markers_v2, hand_markers, collected_markers_v2, owed_state
#     (#566's recomputeSeq); CREATE IF NOT
#     EXISTS network_seen, collected_markers_v2, hand_markers, proof_posts,
#     hopsweep_records, owed_rows, owed_state, handfile_batches, handfile_rows
#   READS the money tables, the markers, transactions / pot_beefs, the
#     eviction ledger (pot_evictions, pot_records_evicted), network_seen,
#     submit_refusals (the manifest's `readers` lists every one)
# Never-wipe (the owner's ruling of 2026-10-07): the money tables and the
# filings, the eviction ledger and its twins, collected_markers and
# banned_hosts; a wipe moves LOW's own era cutoff only.
[[d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db"
database_id = "__LOW_APPLAYER_DEFAULT_D1_LOW_OVERLAY_DB_ID__"  # injected at deploy time from the private secrets store by name

# CHAINTRACKS binds rust-chaintracks in both renders. /tip reads its verified
# header and /getInfo.lastPassAt (chaintracks 0.7.1); absent means unknown.
# Only /tip reads /getInfo. TIP_MAX_AGE_MS, TIP_REORG_MARGIN and
# TIP_RETRY_AFTER_SECS are code constants, not vars. A plain workers.dev fetch to a
# same-account worker loops back to this worker (returns our own 404), so the
# binding is required for the fetch to reach ChainTracks. `service` is a
# worker name, not a secret.
[[services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# Service binding to the LOW watchtower worker (same account). /live-view
# uses this for its BOUNDED case fan-out: the tower's PUBLIC no-auth
# `GET /case/:gameId` view, at most LIVE_VIEW_CASE_FANOUT_CAP (8) fetches
# per request, each raced against a per-fetch timeout — any fault only
# degrades that row's `case` to null, never the route. `service` is a
# worker name, not a secret.
[[services]]
binding = "TOWER"
service = "low-watchtower"

# Service binding to the LOW relay (same account) for `/broadcast` (the lobby /
# leaderboard / tip rooms) and `/push` (per-seat `low_events` boxes). REQUIRED:
# Cloudflare refuses a plain fetch between two Workers on one zone (error 1042
# behind a 404), and every *.workers.dev host of an account is ONE zone —
# proven on beta 2026-09-03. `service` is a worker name, not a secret.
[[services]]
binding = "RELAY"
service = "low-relay"
# bsv-low loop 6 (2026-09-07): the LOW overlay (same account) for the
# block-event spend-confirmation pass (`POST /internal/tip-changed`, bearer
# INTERNAL_TOKEN) forwarded from chaintracks' tip. Same 1042 rule as RELAY.
# `service` is a worker name, not a secret.
[[services]]
binding = "OVERLAY"
service = "low-overlay"
# bsv-low #532: LOW's identity resolver (same account) for the identity views (`src/identity.rs`): names,
# pictures and their SMT proofs. Same 1042 rule as RELAY. `service` is a worker name, not a secret.
# bsv-low #656 (2026-10-18, the identity window 2): the prod resolver exists since 21:2xZ on Zanaadu's final
# era seed artifact (app-layer-lib be45b4c6), so the null-resolver mode of DESIGN-NULL-RESOLVER-2026-10-15
# (remedy B: both blocks deliberately absent, the identity reads answering ERR_NO_RESOLVER) ENDS with this
# config-only redeploy. ERR_NO_RESOLVER stays the nameable answer for a render that binds none.
[[services]]
binding = "IDENTITY"
service = "low-identity-resolver"

# bsv-low #532: the identity views' kill list (one key per killed picture hash, written only by
# `POST /internal/identity/kill`). id is a placeholder, injected at deploy time like AUTH_SESSIONS'.
[[kv_namespaces]]
binding = "IDENTITY_KILL"
id = "__LOW_APPLAYER_DEFAULT_KV_IDENTITY_KILL_ID__"  # low-app-layer-identity-kill

# bsv-low #912 (D2-ACTOR-B): the owed actor's display copy (MEDIUM-9): at most one write a second per identity,
# served display-only (`claimable` false) when the actor cannot be reached. Placeholder id, injected at deploy time
# (`npx wrangler kv namespace create OWED_COPY`).
[[kv_namespaces]]
binding = "OWED_COPY"
id = "__LOW_APPLAYER_DEFAULT_KV_OWED_COPY_ID__"  # low-app-layer-owed-copy

# ══════════════════════════════════════════════════════════════════════════
# beta — the ISOLATED pre-release stack (bsv-low, 2026-08-12)
#
#   npx wrangler deploy --env beta
#
# Reads the BETA overlay's D1, so beta money views are built from beta rows
# only and the whole environment can be wiped without touching prod. This
# worker needs no topic-suffix awareness of its own: it never calls the
# overlay and never filters on a `topic` column — the per-protocol tables it
# reads (pot_records, potparty_records, result_markers_v2, …) are per-topic by
# construction, so the database binding IS the isolation.
#
# ORDER MATTERS on a fresh beta D1: deploy + warm the BETA OVERLAY first (it
# owns the schema). This worker only ALTERs/CREATEs a few latch columns and
# two tables; against a database whose base tables don't exist yet those
# statements fail as not-benign, so the migration latch never sets and every
# request re-issues them until the overlay has run once.
#
# NOTHING is inherited from the blocks above — wrangler env sections do not
# inherit vars, d1_databases, kv_namespaces or services. Every binding this
# worker reads is redeclared here on purpose.
# ══════════════════════════════════════════════════════════════════════════

[durable_objects]
bindings = [
  { name = "BOARD_VIEW", class_name = "BoardView" },
  # bsv-low #441 (2026-09-10): the session lane's store (bsv-middleware-cloudflare
  # 0.3.4 `AuthSessionStore`): one object per BRC-104 session nonce and per lane id.
  { name = "AUTH_SESSION_STORE", class_name = "AuthSessionStore" },
  # bsv-low #912 (D2-ACTOR-B): the owed judge's actor, one per identity (idFromName of the lowercased key), its own
  # SQLite. Reached by binding only (the consumer's delivery, the writers' direct call, the read).
  { name = "OWED_ACTOR", class_name = "OwedActor" },
]

[[migrations]]
tag = "v2-boardview"
new_classes = ["BoardView"]

[[migrations]]
tag = "v3-auth-session-store"
new_classes = ["AuthSessionStore"]

# bsv-low #912: appended, never renamed. A `new_sqlite_classes` class (the actor's SqlStorage). Its wipe is each
# actor's `/reset` (deleteAll) over the identity list read from D1 BEFORE the wipe, or a `deleted_classes` migration
# and a fresh class name (LOW-2).
[[migrations]]
tag = "v4-owed-actor"
new_sqlite_classes = ["OwedActor"]

# bsv-low #911 (D2-ACTOR-A): the `owed-events` queue. The app layer PRODUCES
# (the record door, the hooks, the word ingest and the un-acked mark sweep
# publish beside their marks) and is its ONE CONSUMER: the judge's only trigger
# (owed_events.rs). `max_batch_timeout = 0` (LOW-5: the judge's trigger never
# waits a batch); `max_batch_size = 16` (D2-ACTOR-E, bsv-low #954: a backlog's
# messages are delivered together and judged once per identity, equal to
# `CONSUMER_BATCH_MAX`, pinned); `max_concurrency = 1` (the lens's
# MEDIUM-1: one judge at a time fleet-wide, the per-identity serialiser until
# lane B's actor); a message whose judge faults is handed
# back, `max_retries = 3`, then dead-lettered. Create both queues before
# deploying: `wrangler queues create low-owed-events` and `wrangler queues create low-owed-events-dlq`.
[[queues.producers]]
queue = "low-owed-events"
binding = "OWED_EVENTS"

[[queues.consumers]]
queue = "low-owed-events"
max_batch_size = 16
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "low-owed-events-dlq"
# D2-ACTOR-D (bsv-low #952): ONE consumer while the D1 judge writes `owed_rows` (Phases A and B): two consumers
# judging one identity's games would be two D1 writers, the first's stale rows committed over the second's. Equal to
# `OWED_CONSUMER_CONCURRENCY` in [vars] (pinned); Phase C's cutover moves both together.
max_concurrency = 1

# LOW-3: the owed events' dead letters, parked in D1 (`owed_event_dead_letters`,
# park first, ack after) and re-driven by the overlay's lever
# (`POST /internal/redrive-dead-letters` with `"family":"owed-events"`). A dead
# letter's marks stay in `owed_dirty`: the sweep re-publishes them anyway.
[[queues.consumers]]
queue = "low-owed-events-dlq"
max_batch_size = 10
max_retries = 100
retry_delay = 300
max_concurrency = 1

# Workers Logs (2026-09-03): persistent, queryable invocation logs for the fleet.
[observability]
enabled = true
head_sampling_rate = 1

[env.beta]
name = "low-app-layer-beta"

[env.beta.vars]
# bsv-low #912 (D2-ACTOR-B): Phase B's read flag (the actor's rows served) and Phase C's (the D1 judge off). Off and
# on until E4: Phase A, the actor applies beside the D1 judge and its rows are compared.
OWED_ACTOR_READ = "false"
OWED_D1_JUDGE = "true"
# D2-ACTOR-D (bsv-low #952): the `owed-events` consumer's concurrency, the cutover doc's knob: "1" while the D1 judge
# writes `owed_rows` (Phases A and B: two consumers judging one identity's games are two D1 writers); Phase C (the
# actor the one writer, each identity serialised by its own Durable Object) may raise it, moved WITH the consumer's
# `max_concurrency` below (pinned equal; the consumer names a value above 1 while `OWED_D1_JUDGE` is on, every batch).
OWED_CONSUMER_CONCURRENCY = "1"
RELAY_URL = "https://__HOST_RELAY_BETA__"
OVERLAY_URL = "https://__HOST_OVERLAY_BETA__"
ARCADE_URL = "https://arcade-v2-us-1.bsvblockchain.tech"
# bsv-low #532 (see the prod vars): beta's resolver, and beta's app origins (the beta site, the fleet's harness
# deployment, a local dev server: localhost is on this beta list only, never prod's, pinned in identity_tests.rs).
IDENTITY_URL = "https://__HOST_IDENTITY_RESOLVER_BETA__"
IDENTITY_APP_ORIGINS = "https://__HOST_PAGES_BETA__,https://__HOST_PAGES_HARNESS__,http://localhost:5173"
# bsv-low #441 C6 (2026-09-14): STRICT on beta — the client's identity reads are
# handshake-first (a cold read waits for its warmup, bounded) so an honest read is
# never anonymous; prod stays lenient until the promotion.
AUTH_ENFORCE = "true"
SESSION_LANE = "true"
# bsv-low #670 (round 2, question 6): the beta-only marker a TEST-ONLY knob needs
# (`auth::test_knob_n`). Never in the prod [vars] (pinned): wrangler env vars do not
# inherit, so prod has no marker and a knob put there is inert. The planted store
# fault's knob `AUTH_STORE_FAULT_TEST` is set beside it only by the drill's deploy.
LOW_BETA_MARKER = "_beta"
# Beta's own storage epoch — bumping THIS orders beta clients to clear their
# local state without touching prod clients.
STORAGE_EPOCH = "beta-2026-10-26-1"
# 2026-08-27 — SET (the rehearsal the note below anticipated): beta's own
# campaign history crossed the 500-pot leaderboard window (BOARD_CLAIM_LIMIT),
# so every board page returned truncated:true and every client fell back to
# the slow gather (layer 10 of the enforced-board onion; decision log
# addendum 21). Cutoff = 2026-08-27 00:00 UTC / first block past midnight
# (964063 @ 00:12:31Z) — retires the pre-today era from every view while the
# day's live cells keep serving. Bump forward the same way whenever beta's
# window re-fills; the durable fix is board paging (#403 item 4).
# (Original stance, kept for the why of the mechanism: the #375 era write-off
# retires a pre-launch era; wiping beta wholesale is a DELETE, not a cutoff.)
# 2026-09-21 (the M21 promotion's wipe): the beta cutoff bumped to the activation instant 2026-09-21T13:04:21Z / tip 967727
# (the fleet loops 11 to 21 written off from every view; the collect pass ran first, 14/18 pressed green, 4 #512 already-held).
WRITTEN_OFF_BEFORE_MS = "1793028153000"
WRITTEN_OFF_BEFORE_HEIGHT = "972762"
# bsv-low #862 (L7-DEPTH): the host's spend depth (see the prod vars).
SPEND_DEPTH = "1"

# Beta's OWN session store. AUTH_SESSIONS and SERVER_PRIVATE_KEY are all-or-
# nothing: the front door computes `configured = key AND kv`, and an
# auth-attempting client against a half-configured worker gets 503 on EVERY
# route — including /health — because the handshake is judged before route
# exemptions. Set both, or neither.
[[env.beta.kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "__LOW_APPLAYER_BETA_KV_AUTH_SESSIONS_ID__"  # low-app-layer-beta-AUTH_SESSIONS

[[env.beta.d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db-beta"
database_id = "__LOW_APPLAYER_BETA_D1_LOW_OVERLAY_DB_BETA_ID__"

[[env.beta.services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# The BETA tower. Binding prod's here would let prod case answers bleed into
# beta rows: the fan-out is by gameId and the case↔pot binding is explicitly
# not verified. Absence would be safe (case: null); prod would not be.
[[env.beta.services]]
binding = "TOWER"
service = "low-watchtower-beta"

# The BETA relay (see the prod RELAY binding for the why).
[[env.beta.services]]
binding = "RELAY"
service = "low-relay-beta"
# The BETA overlay for the block-event pass (see the prod OVERLAY binding).
[[env.beta.services]]
binding = "OVERLAY"
service = "low-overlay-beta"
# The BETA identity resolver and beta's own kill list (see the prod IDENTITY / IDENTITY_KILL blocks).
[[env.beta.services]]
binding = "IDENTITY"
service = "low-identity-resolver-beta"

[[env.beta.kv_namespaces]]
binding = "IDENTITY_KILL"
id = "__LOW_APPLAYER_BETA_KV_IDENTITY_KILL_ID__"  # low-app-layer-identity-kill-beta

[[env.beta.kv_namespaces]]
binding = "OWED_COPY"
id = "__LOW_APPLAYER_BETA_KV_OWED_COPY_ID__"  # low-app-layer-owed-copy-beta

[env.beta.durable_objects]
bindings = [
  { name = "BOARD_VIEW", class_name = "BoardView" },
  { name = "AUTH_SESSION_STORE", class_name = "AuthSessionStore" },
  { name = "OWED_ACTOR", class_name = "OwedActor" },
]

# bsv-low #911 (D2-ACTOR-A): the `owed-events` queue. The app layer PRODUCES
# (the record door, the hooks, the word ingest and the un-acked mark sweep
# publish beside their marks) and is its ONE CONSUMER: the judge's only trigger
# (owed_events.rs). `max_batch_timeout = 0` (LOW-5: the judge's trigger never
# waits a batch); `max_batch_size = 16` (D2-ACTOR-E, bsv-low #954: a backlog's
# messages are delivered together and judged once per identity, equal to
# `CONSUMER_BATCH_MAX`, pinned); `max_concurrency = 1` (the lens's
# MEDIUM-1: one judge at a time fleet-wide, the per-identity serialiser until
# lane B's actor); a message whose judge faults is handed
# back, `max_retries = 3`, then dead-lettered. Create both queues before
# deploying: `wrangler queues create low-owed-events-beta` and `wrangler queues create low-owed-events-beta-dlq`.
[[env.beta.queues.producers]]
queue = "low-owed-events-beta"
binding = "OWED_EVENTS"

[[env.beta.queues.consumers]]
queue = "low-owed-events-beta"
max_batch_size = 16
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "low-owed-events-beta-dlq"
# D2-ACTOR-D (bsv-low #952): ONE consumer while the D1 judge writes `owed_rows` (Phases A and B): two consumers
# judging one identity's games would be two D1 writers, the first's stale rows committed over the second's. Equal to
# `OWED_CONSUMER_CONCURRENCY` in [vars] (pinned); Phase C's cutover moves both together.
max_concurrency = 1

# LOW-3: the owed events' dead letters, parked in D1 (`owed_event_dead_letters`,
# park first, ack after) and re-driven by the overlay's lever
# (`POST /internal/redrive-dead-letters` with `"family":"owed-events"`). A dead
# letter's marks stay in `owed_dirty`: the sweep re-publishes them anyway.
[[env.beta.queues.consumers]]
queue = "low-owed-events-beta-dlq"
max_batch_size = 10
max_retries = 100
retry_delay = 300
max_concurrency = 1

# One bounded deploy convergence page per scheduled owed-clock pass.
[triggers]
crons = ["*/15 * * * *"]

[env.beta.triggers]
crons = ["*/15 * * * *"]
