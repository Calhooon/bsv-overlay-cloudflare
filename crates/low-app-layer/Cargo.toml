[package]
name = "low-app-layer"
description = "LOW app-layer — read-only, browser-facing chain-facts Worker over the low-overlay D1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# bsv-low #553: a member of the LOW workers' workspace, not the root one.
workspace = "../../workers"

[lib]
# `cdylib` for the Cloudflare Workers wasm32 build (worker-build consumes
# this). `rlib` so `cargo test -p low-app-layer` can link and run the pure
# helper unit tests natively (same rationale as overlay-cloudflare's lib).
crate-type = ["cdylib", "rlib"]

[build-dependencies]
bsv-worker-build-info = { version = "0.3.1", path = "../worker-build-info", features = ["build"] }

[dependencies]
bsv-worker-build-info = { version = "0.3.1", path = "../worker-build-info" }
getrandom = { version = "0.2", features = ["js"] }
# worker 0.8 (bsv-low #318): `bsv-middleware-cloudflare` 0.3 — the canonical
# BRC-103/104 middleware, the SAME major the low-watchtower pins — requires
# `worker ^0.8`. Only `d1` is needed: this worker is a pure READ surface (no
# queues, no durable objects).
#
# #318 originally left the sibling `overlay-cloudflare` on worker 0.7.5 with
# the note "the two crates build independently". THAT WAS FALSE and it cost a
# month of undeployability (bsv-low #348): `worker-build` reads the WORKSPACE
# Cargo.lock, and its per-crate disambiguation is dead code (off-by-one in
# `Lockfile::get_package_version`, 0.7.5 → 0.8.5), so it takes the LOWEST
# `worker` in the lock regardless of which crate it was invoked from. Plain
# `cargo build` is fine with two majors, which is exactly why `make ci` stayed
# green over an undeployable worker. THE WORKSPACE MAY HOLD EXACTLY ONE
# `worker` VERSION — it is now 0.8 everywhere. Do not reintroduce a second.
worker = { version = "0.8", features = ["d1"] }
# BRC-103/104 mutual-auth front door (bsv-low #318) — the canonical public
# middleware, pinned from crates.io at the same major the tower pins
# (`workers/low-watchtower` pins "0.3"; NEVER a cargo path-patch — a dead
# path-patch once stranded the relay on 0.2.0, see the middleware-lineage
# note in bsv-low's decision log). Exactly 0.4.1 (bsv-low #588; it was =0.3.8, bsv-low #577): 0.4.0 moved the rules
# to `bsv-middleware-core` 0.1.0 (the session lane, D12, whole; re-exported at the 0.3 paths, the `AuthSessionStore`
# DO untouched) and 0.4.1 answers every authentication refusal as its own 401 (`AuthResult::Response`), where 0.3.8
# raised four of them as `Err` (see `auth::front_door`). Never 0.3.7, which shipped without the payment path's
# output check; the payment path (0.4.0's fail-closed BRC-29) is not linked into a route here: the app layer never charges.
# Exactly 0.5.0 (align-engine-050, 2026-10-10): `bsv-middleware-core` 0.2.0 and bsv-rs 0.4, one SDK in the lock. 0.5.0
# moves the payment verdict (`PaymentVerifyError::Unverifiable { reason }`; `BadTransaction`, `MissingOutput`,
# `BadBeef` gone); none of the auth, session-lane or signing items this crate calls moved, and it compiled unchanged.
# Exactly 0.6.2 (lane L2-migrate-engine, 2026-10-15): the middleware's release on bsv-rs 0.6.0 (core 0.3.2),
# so the lock holds one bsv-rs, as the build stamp requires.
# Exactly 0.7.0 (lane W8e, 2026-10-19): the middleware's release on bsv-rs 0.7.0 (core 0.4.0), one
# bsv-rs in the lock. Its payment-prefix claim (`PaymentPrefixStore`, `PAYMENT_CLAIMS_MIGRATION`) is on
# the payment path, which this crate does not link: no claims table here, the migration does not apply.
# Exactly 0.7.1 (REPIN-080-OVERLAY, 2026-10-21): core stays 0.4.0, the floor bsv-rs `^0.7.0` takes the
# workspace's 0.7.2. 0.7.1 is the payment door's fail-closed posture (`FaultPosture::Closed`, 503
# `ERR_PAYMENT_UNAVAILABLE`, `PrefixGate::Refuse` gains `headers`); this crate links no payment door, unchanged.
bsv-middleware-cloudflare = "=0.7.1"
serde.workspace = true
# bsv-low #532: `raw_value` so the identity views pass the resolver's JSON through byte for byte.
serde_json = { workspace = true, features = ["raw_value"] }
hex.workspace = true
# bsv-low P1.1 proof-in-DB (2026-09-02): the posted bundle travels base64 (same crate/version as the overlay).
base64 = "0.22"
# BEEF parsing for /pots-view's spenderRawHex extraction (the same crate the
# sibling overlay worker uses; `overlay` feature only — no net/tokio on wasm32).
bsv-rs.workspace = true
# Exactly 0.6.0 (lane W8e): the tracker on bsv-rs 0.7.0, the minor its public types carry with them
# (0.5.0 adds `HintStatus::MempoolPresent` and the compact State; 0.4.1 trims the Arcade word and reads
# `extraInfo` as text). The same pin as the overlay's door, one copy in the lock.
# Exactly 0.7.0 (REPIN-080-OVERLAY, 2026-10-21): the reorg rule BY THE ROOT (a `mined` word is `stale` iff its
# root is not the active header's root at its height; `Reask::Reorg` means the root moved) and
# `MempoolPresent` over `built` moves the word to `announced`. No public type changes.
bsv-tracker = "=0.7.0"
# Shared parser policies for client-derived BEEF read from the overlay's store.
overlay-engine = { package = "bsv-overlay-engine", version = "0.3.1", path = "../overlay-engine" }
# The `Poc5TemplatePot` covenant recognizer + param-region accessor (the SAME
# frozen template bytes `tm_pot` admits with) — used by the settle classifier
# (bsv-low #227) to recover a pot's COMMITTED params from its funding lock.
overlay-discovery = { package = "bsv-overlay-discovery", version = "0.3.1", path = "../overlay-discovery" }
# bsv-low #553: the `LOW/proof/v1` replay (was `overlay_discovery::proof::replay`),
# run on a posted bundle and on a row the overlay admitted before the replay
# shipped. It carries the PATH deps on the private `bsv-low` checkout.
low-proof-replay = { package = "bsv-low-proof-replay", version = "0.3.1", path = "../low-proof-replay" }
# Readable wasm panics in `wrangler tail` (same pattern as the overlay worker).
console_error_panic_hook = "0.1"
# /live-view's bounded tower fan-out: `select` races each service-binding
# /case fetch against a `worker::Delay` (the tower's #272 with_timeout
# idiom), `join_all` runs the ≤8 fetches concurrently. std only — no
# executor, no net; works on wasm32.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# #318 real-crypto auth round-trip (tests/auth_real_crypto_roundtrip.rs):
# the SDK's REAL BRC-103 `Peer` on both ends (the implementation the
# middleware ports 1:1), real ECDSA over real random keys — never a mocked
# verify. `auth` is dev-only and never reaches the wasm32 worker build.
bsv-rs = { workspace = true, features = ["auth"] }
async-trait = "0.1"

# Native only (bsv-low #670: none of these builds for the wasm32 test target).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Real SQLite (bundled) + the overlay's PRODUCTION migration list, so the
# `/results` read-window test EXECUTES the shipped `results_sql()` against the
# real schema rather than pinning its text (bsv-low #281). Test-only: neither
# is linked into the wasm32 Worker build.
rusqlite = { version = "0.32", features = ["bundled"] }
bsv-overlay-cloudflare = { version = "0.3.1", path = "../overlay-cloudflare" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

# bsv-low #670 (the lens's HIGH-3): `tests/door_wasm.rs` drives the door's real
# middleware path on wasm32 under Node, where a `worker::Request` exists.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
