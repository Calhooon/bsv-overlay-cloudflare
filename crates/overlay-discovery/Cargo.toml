[package]
name = "bsv-overlay-discovery"
description = "Topic managers and lookup services for the BSV overlay network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bitcoin", "bsv", "overlay", "discovery"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*.rs", "src/pot/poc5_template.hex", "src/uhrp/fixtures/hash/*.json", "docs/*.md", "README.md", "LICENSE-*"]

[dependencies]
overlay-engine = { package = "bsv-overlay-engine", version = "0.3.0", path = "../overlay-engine" }
bsv-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hex.workspace = true
async-trait.workspace = true
# ls_proof answers carry the raw proof-bundle bytes base64-encoded
# (bundleBase64). Same version as overlay-cloudflare's existing dep.
base64 = "0.22"
# bsv-low #553 (2026-10-06): NO dependency here may be a path outside this
# repository. The `LOW/proof/v1` replay and its two PATH deps on the private
# `bsv-low` checkout (`low-core`, `low-wire`) live in `crates/low-proof-replay`,
# a member of the LOW workers' workspace (`workers/Cargo.toml`), and reach
# `ProofLookupService` as a hook. Cargo reads a WORKSPACE MEMBER's path
# dependencies even when they are optional, so with a feature gate here a
# fresh clone of this repository alone could not load its workspace
# (measured: `failed to load manifest for dependency low-core`). That is the
# clause of the bar the two workspaces meet. A consumer pinning this crate by
# git rev would have resolved with the gate alone (measured too: inside a git
# source cargo never loads an unactivated optional path dependency).

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `std::time::SystemTime::now()` panics on wasm32-unknown-unknown, route
# timestamps through `js_sys::Date` on that target. Mirrors overlay-engine's
# `current_timestamp_ms`. See uhrp/topic_manager.rs::current_unix_seconds.
js-sys = "0.3"

[dev-dependencies]
overlay-engine = { package = "bsv-overlay-engine", version = "0.3.0", path = "../overlay-engine", features = ["memory-storage"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
