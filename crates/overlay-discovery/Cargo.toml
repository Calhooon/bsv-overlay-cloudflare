[package]
name = "bsv-overlay-discovery"
description = "SHIP/SLAP topic managers and lookup services for BSV overlay network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
overlay-engine = { package = "bsv-overlay-engine", version = "0.1", path = "../overlay-engine" }
bsv-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hex.workspace = true
async-trait.workspace = true
# ls_proof answers carry the raw proof-bundle bytes base64-encoded
# (bundleBase64). Same version as overlay-cloudflare's existing dep.
base64 = "0.22"
# bsv-low P1.1 part b (2026-09-02): the server-side replay of a
# `LOW/proof/v1` bundle — the SAME pure crates the client's wasm wraps
# (`low-core` mental/discard math, `low-wire` signed envelopes; native +
# wasm32, no I/O, no RNG). Cross-repo PATH deps (the sister checkout at
# ../bsv-low, the same shape bsv-wallet-cli uses for its toolbox); the
# fields they inherit (`version.workspace`) resolve against THEIR workspace.
low-core = { path = "../../../bsv-low/crates/low-core" }
low-wire = { path = "../../../bsv-low/crates/low-wire" }
# Bundles are gzip-compressed by the client past a size threshold; the pure
# Rust backend builds on wasm32-unknown-unknown.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `std::time::SystemTime::now()` panics on wasm32-unknown-unknown — route
# timestamps through `js_sys::Date` on that target. Mirrors overlay-engine's
# `current_timestamp_ms`. See uhrp/topic_manager.rs::current_unix_seconds.
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
