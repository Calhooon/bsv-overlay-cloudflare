[package]
name = "bsv-overlay-engine"
description = "Transaction admission, lookup and GASP synchronization for BSV overlay services."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bitcoin", "bsv", "overlay", "spv"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*.rs", "README.md", "LICENSE-*"]

[features]
default = []
memory-storage = []
# GASP's shadow under `admit_graph` (bsv-low #657, R7.7 item 5): the
# `gasp_shadow` module, `Engine::set_gasp_shadow` and the finalize's shadow
# arms. Default OFF, so an `off` Worker links none of A's GASP path (the shadow
# lens's MEDIUM 1, `scripts/check-gasp-shadow-size.sh`). A host that runs
# `ADMISSION_MODE=shadow` builds with it on.
gasp-shadow = []

[dependencies]
bsv-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = "1"
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
# Integration tests use the in-process `MemoryStorage` backend. The
# `memory-storage` feature is opt-in for the lib (production deployments
# wire D1 / SQLite), but every integration test instantiates it, so we
# enable it for `cargo test` via a self-feature dev-dep.
bsv-overlay-engine = { path = ".", features = ["memory-storage"] }
