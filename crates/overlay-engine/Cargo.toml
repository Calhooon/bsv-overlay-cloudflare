[package]
name = "bsv-overlay-engine"
description = "Transaction admission, lookup and GASP synchronization for BSV overlay services."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bitcoin", "bsv", "overlay", "spv"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*.rs", "README.md", "LICENSE-*"]

[features]
default = []
memory-storage = []

[dependencies]
bsv-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = "1"
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
# Integration tests use the in-process `MemoryStorage` backend. The
# `memory-storage` feature is opt-in for the lib (production deployments
# wire D1 / SQLite), but every integration test instantiates it, so we
# enable it for `cargo test` via a self-feature dev-dep.
bsv-overlay-engine = { path = ".", features = ["memory-storage"] }

[lints]
workspace = true
