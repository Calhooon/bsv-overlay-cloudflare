name = "bsv-overlay-cloudflare"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

account_id = "<your-cloudflare-account-id>"

[build]
# Pin worker-build to ^0.7 — newer 0.8+ requires worker crate ≥0.8 but the
# project pins worker 0.7.5. Without the version pin, `cargo install` grabs
# the latest worker-build and the build fails with "Unsupported version
# worker@0.7.5, expected at least worker@0.8.0".
command = "cargo install -q --version ^0.7 worker-build && worker-build --release"

[[d1_databases]]
binding = "OVERLAY_DB"
database_name = "<your-d1-name>"
database_id = "<your-d1-id>"

[vars]
ENVIRONMENT = "production"
CHAIN_TRACKER_URL = "https://<your-chain-tracker-api>"
HOSTING_URL = "https://<your-overlay>.workers.dev"
# wallet-infra endpoint the CloudflareAdvertiser uses for createAction /
# processAction when it issues SHIP/SLAP tokens. Matches what
# bsv-storage-cloudflare uses — same admin wallet account, same backend.
WALLET_STORAGE_URL = "https://<your-wallet-storage>"
# Registration surface. The production worker carries the full dolphinmilk
# stack (UHRP / Agent / DmDelegation) on top of the mainline SHIP+SLAP
# parity set. Default (unset or empty) = SHIP+SLAP only, which is what the
# parity harness exercises via `wrangler dev --var TOPIC_MANAGERS:` etc.
TOPIC_MANAGERS = "tm_ship,tm_slap,tm_uhrp,tm_agent,tm_dm_delegation"
LOOKUP_SERVICES = "ls_ship,ls_slap,ls_uhrp,ls_agent,ls_dm_delegation"
ENABLE_EXTENSIONS = "true"

# ── /submit admission gating (bsv-low #347) ───────────────────────────────
#
# SUBMIT_ENFORCE — the Rule 6c rollout flag for the /submit admission gate.
#   unset / anything but "true"  = LENIENT (the shipping default): an
#     unauthenticated submit on an UNBARRED path is served exactly as before
#     but counted on /health/invariants as `submitAdmission.unauthenticatedUngated`.
#   "true" = STRICT: those submits are refused 401. `broadcast-gated` — the
#     one public path, barred by real network acceptance — is NEVER refused.
#
#   *** DO NOT SET THIS TO "true" BEFORE bsv-low #351 HAS SHIPPED AND SOAKED. ***
#   The client's marker submits (submitPotPartyMarker / submitPotRefundBeef)
#   still ride the ungated path, and THOSE ROWS ARE THE RECOVERY ENUMERATION a
#   wiped device reads to find its own money. Every caller is fire-and-forget,
#   so a 401 is swallowed silently: flipping early would leave a later wiped
#   device with nothing to enumerate — re-creating, with our own hands, the
#   money path #347 exists to close. Gate the flip on the RELEASES being
#   pinned and soaked, never on the counter (it is attacker-writable:
#   /health/invariants is unauthenticated).
# SUBMIT_ENFORCE = "false"
#
# SUBMIT_OPERATOR_TOKEN — Bearer credential for the UNBARRED submit modes
#   (historical-tx / historical-tx-no-spv / no-header), used by peer sync and
#   migration tooling. Set via `wrangler secret put SUBMIT_OPERATOR_TOKEN`.
#   Unset ⇒ nobody can authenticate ⇒ fail closed.
#
#   DELIBERATELY NOT ADMIN_TOKEN: that one also gates /admin/evictOutpoint,
#   /admin/ban and /admin/startGASPSync, so issuing it to every submit
#   operator (the watchtower included) would grant eviction of any outpoint
#   from the index — exactly the primitive the enumeration-starvation money
#   path needs.
#
# ENABLE_EXTENSIONS also acts as the submit kill switch: "true" enables the
#   x-submit-mode header; ANYTHING ELSE (including a typo) disables it and
#   forces every submit onto the default path. It can never route a caller OFF
#   `broadcast-gated`, which is honoured unconditionally.

# ADMIN_TOKEN: set via `wrangler secret put ADMIN_TOKEN` (not stored in git)
# TAAL_API_KEY: set via `wrangler secret put TAAL_API_KEY` (ARC broadcast to miners)
# SERVER_PRIVATE_KEY: set via `wrangler secret put SERVER_PRIVATE_KEY` (not stored in git)
#   Required by CloudflareAdvertiser to sign SHIP/SLAP PushDrop tokens.
#   Same key that identifies this overlay to peers on BRC-103 auth calls.

[[queues.producers]]
queue = "overlay-mutations"
binding = "MUTATION_QUEUE"

[[queues.consumers]]
queue = "overlay-mutations"
max_batch_size = 1
max_retries = 3

[triggers]
crons = ["*/15 * * * *"]
