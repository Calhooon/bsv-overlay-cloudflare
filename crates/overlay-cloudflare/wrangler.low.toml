# low-overlay — LOW poker lobby overlay instance (bsv-low #39/#40).
#
# A SEPARATE worker + D1 + queue from the main rust-overlay deployment so
# the lobby can't disturb the mainline parity instance. Deploy with:
#
#   npx wrangler deploy --config wrangler.low.toml
#
# account_id comes from the CLOUDFLARE_ACCOUNT_ID environment variable.
# Secrets (set via `wrangler secret put <NAME> --config wrangler.low.toml`):
#   SERVER_PRIVATE_KEY — fresh key for this instance (NOT rust-overlay's)
#   ADMIN_TOKEN        — fresh token for this instance
#   TAAL_API_KEY       — ARC broadcast key (shared with the fleet)

name = "low-overlay"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# worker-build ^0.8 — same crate, same workspace lock, so this pin MUST match
# wrangler.toml's (bsv-low #348: worker-build resolves `worker` from the
# WORKSPACE Cargo.lock and cannot disambiguate per-crate; the workspace now
# holds exactly one `worker`, 0.8.5). A stale ^0.7 here would install
# worker-build 0.7.5, which then refuses the 0.8.5 it finds in the lock — i.e.
# the mirror image of the failure #348 fixed. `make ci-deploy` builds THIS
# config too, so the drift cannot go unnoticed again.
command = "cargo install -q --version ^0.8 worker-build && worker-build --release"

[[d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db"
database_id = "YOUR_D1_DATABASE_ID"  # set to your own D1 database id

[vars]
# W2-P4: the app-layer told which pot rows changed (bearer secret INTERNAL_TOKEN),
# reached through the APP_LAYER service binding; no-ops without the secret.
APP_LAYER_URL = "https://low-app-layer.dev-a3e.workers.dev"
ENVIRONMENT = "production"
CHAIN_TRACKER_URL = "https://rust-chaintracks.dev-a3e.workers.dev"
HOSTING_URL = "https://low-overlay.dev-a3e.workers.dev"
WALLET_STORAGE_URL = "https://wallet-infra.x402agency.com"
# Lobby surface: mainline SHIP/SLAP (so the node can be discovered and can
# index peer ads if ever needed) + the LOW poker lobby topic + the LOW
# break-glass reveal index (tm_reveal / ls_reveal, bsv-low watchtower) + the
# LOW pot-spend landing-proof index (tm_pot / ls_pot) + the LOW hop-side
# index (tm_lowfund → the same ls_pot store, bsv-low #152) + the LOW
# cross-device "already collected" marker index (tm_collected /
# ls_collected, bsv-low #161) + the LOW hand-result leaderboard marker
# index (tm_result / ls_result, bsv-low #38) + the rung-3
# transcript-proof bundle index (tm_proof / ls_proof) + the by-identity
# pot-participation recovery index (tm_potparty / ls_potparty, bsv-low #188)
# + the pre-signed refund-backup recovery index (tm_potrefund /
# ls_potrefund, bsv-low #191) + the hop-in-flight marker index
# (tm_hopparty / ls_hopparty, bsv-low #315).
TOPIC_MANAGERS = "tm_ship,tm_slap,tm_low,tm_reveal,tm_pot,tm_lowfund,tm_collected,tm_hand,tm_result,tm_proof,tm_potparty,tm_potrefund,tm_hopparty"
LOOKUP_SERVICES = "ls_ship,ls_slap,ls_low,ls_reveal,ls_pot,ls_collected,ls_hand,ls_result,ls_proof,ls_potparty,ls_potrefund,ls_hopparty"
ENABLE_EXTENSIONS = "true"

# ── /submit admission gating (bsv-low #347) ───────────────────────────────
#
# SUBMIT_ENFORCE — the Rule 6c rollout flag for the /submit admission gate.
#   unset / anything but "true"  = LENIENT (the shipping default): an
#     unauthenticated submit on an UNBARRED path is served exactly as before
#     but counted on /health/invariants as `submitAdmission.unauthenticatedUngated`.
#   "true" = STRICT: those submits are refused 401. `broadcast-gated` — the
#     one public path, barred by real network acceptance — is NEVER refused.
#
#   *** DO NOT SET THIS TO "true" BEFORE bsv-low #351 HAS SHIPPED AND SOAKED. ***
#   The client's marker submits (submitPotPartyMarker / submitPotRefundBeef)
#   still ride the ungated path, and THOSE ROWS ARE THE RECOVERY ENUMERATION a
#   wiped device reads to find its own money. Every caller is fire-and-forget,
#   so a 401 is swallowed silently: flipping early would leave a later wiped
#   device with nothing to enumerate — re-creating, with our own hands, the
#   money path #347 exists to close. Gate the flip on the RELEASES being
#   pinned and soaked, never on the counter (it is attacker-writable:
#   /health/invariants is unauthenticated).
# SUBMIT_ENFORCE = "false"
#
# SUBMIT_OPERATOR_TOKEN — Bearer credential for the UNBARRED submit modes
#   (historical-tx / historical-tx-no-spv / no-header), used by peer sync and
#   migration tooling. Set via `wrangler secret put SUBMIT_OPERATOR_TOKEN`.
#   Unset ⇒ nobody can authenticate ⇒ fail closed.
#
#   DELIBERATELY NOT ADMIN_TOKEN: that one also gates /admin/evictOutpoint,
#   /admin/ban and /admin/startGASPSync, so issuing it to every submit
#   operator (the watchtower included) would grant eviction of any outpoint
#   from the index — exactly the primitive the enumeration-starvation money
#   path needs.
#
# ENABLE_EXTENSIONS also acts as the submit kill switch: "true" enables the
#   x-submit-mode header; ANYTHING ELSE (including a typo) disables it and
#   forces every submit onto the default path. It can never route a caller OFF
#   `broadcast-gated`, which is honoured unconditionally.


# Service binding to the ChainTracks worker (same account). ls_low uses this to
# resolve the chain tip for query-time table-expiry filtering (#148): a plain
# workers.dev URL fetch to a same-account worker loops back to this worker (404),
# so the binding is required for the tip fetch to reach ChainTracks. `service` is
# a worker name, not a secret.
[[services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# Service binding to the LOW app-layer (same account) for the W2-P4
# `/internal/pot-changed` note. REQUIRED: Cloudflare refuses a plain fetch
# between two Workers on one zone (1042 behind a 404), and every *.workers.dev
# host of an account is ONE zone — proven on beta 2026-09-03. `service` is a
# worker name, not a secret.
[[services]]
binding = "APP_LAYER"
service = "low-app-layer"

[[queues.producers]]
queue = "low-overlay-mutations"
binding = "MUTATION_QUEUE"

[[queues.consumers]]
queue = "low-overlay-mutations"
max_batch_size = 1
max_retries = 3
# S2 (2026-08-29): a replay that still faults after max_retries must LAND
# somewhere an operator can see — never a silent drop. Create the queue
# BEFORE deploying: `wrangler queues create low-overlay-mutations-dlq`
# (wrangler refuses a deploy naming a queue that does not exist — loud, by
# design).
dead_letter_queue = "low-overlay-mutations-dlq"

[triggers]
crons = ["*/15 * * * *"]

# ══════════════════════════════════════════════════════════════════════════
# beta — the ISOLATED pre-release stack (bsv-low, 2026-08-12)
#
#   npx wrangler deploy --config wrangler.low.toml --env beta
#
# Purpose: keep PROD STABLE. Beta runs the next client/server build against
# real mainnet money, and its whole index can be WIPED without touching a
# single prod row.
#
# Isolation is by BINDING **and** by NAME, the zanaadu model:
#   - its own D1 (`low-overlay-db-beta`) — the real isolation, because the
#     per-protocol index tables (pot_records, low_records, …) carry NO topic
#     column, so a shared DB would be shared data no matter what the topics
#     were called;
#   - `TOPIC_SUFFIX = "_beta"` — every LOW topic/service registers as
#     `tm_low_beta` / `ls_low_beta`, which makes a cross-stack mistake FAIL
#     CLOSED instead of silently writing into the wrong index (a beta client
#     aimed at prod asks for a topic prod does not have, and vice versa);
#   - its own queue, its own HOSTING_URL, its own SERVER_PRIVATE_KEY. The
#     last two are load-bearing: the advertiser revokes ads that are its own
#     identity + hosting URL but no longer configured, so a beta sharing
#     prod's key and URL would try to revoke PROD's entire SHIP/SLAP ad set.
#
# SHIP/SLAP are deliberately NOT suffixed (see src/lib.rs) — peer discovery
# is a global namespace and the engine hardcodes those four names.
#
# WIPING BETA (the point of all this) — never against the prod database id:
#   npx wrangler d1 execute low-overlay-db-beta --remote --command "DELETE FROM …"
# ══════════════════════════════════════════════════════════════════════════

[env.beta]
name = "low-overlay-beta"

[env.beta.vars]
# W2-P4: the app-layer told which pot rows changed (bearer secret INTERNAL_TOKEN).
APP_LAYER_URL = "https://low-app-layer-beta.dev-a3e.workers.dev"
ENVIRONMENT = "production"
# The per-environment topic namespace. MUST match the client's
# VITE_OVERLAY_TOPIC_SUFFIX (app/.env.beta) — a mismatch means every submit
# and lookup is refused, which is the intended fail-closed behaviour.
# Lowercase letters + a single leading underscore ONLY: the BRC-87 name
# validator rejects digits, so `_beta2` would make our own SHIP ad
# self-reject.
TOPIC_SUFFIX = "_beta"
CHAIN_TRACKER_URL = "https://rust-chaintracks.dev-a3e.workers.dev"
# Its OWN hosting URL — also what scopes this deploy's advertisement set.
HOSTING_URL = "https://low-overlay-beta.dev-a3e.workers.dev"
WALLET_STORAGE_URL = "https://wallet-infra.x402agency.com"
# BASE names in both envs — the suffix is applied at registration, in one
# place (src/lib.rs), so a topic added later cannot be forgotten by it.
TOPIC_MANAGERS = "tm_ship,tm_slap,tm_low,tm_reveal,tm_pot,tm_lowfund,tm_collected,tm_hand,tm_result,tm_proof,tm_potparty,tm_potrefund,tm_hopparty"
LOOKUP_SERVICES = "ls_ship,ls_slap,ls_low,ls_reveal,ls_pot,ls_collected,ls_hand,ls_result,ls_proof,ls_potparty,ls_potrefund,ls_hopparty"
ENABLE_EXTENSIONS = "true"
# ── #347 STRICT ON BETA (bsv-low #407, 2026-08-24) ────────────────────────
# The Rule 6c lenient window is CLOSED here: an unauthenticated submit on any
# UNBARRED path (every mode except `broadcast-gated`) is refused 401.
#
# The criterion's leg (1) is met — bsv-low #407 moved every client producer
# onto `broadcast-gated`, so `app/src` now contains exactly two `x-submit-mode`
# sites and both are the barred one; the last script we own migrated with it.
# Leg (2) was already met: the watchtower carries SUBMIT_OPERATOR_TOKEN (its
# index leg shows up in the census as `operator`, and operator-authed ungated
# submits stay allowed).
#
# PROVEN before flipping, on beta with real sats: four cooperative hands, ZERO
# ungated CLIENT submits in the census delta (was 16/hand), every marker still
# indexed — the potparty + potrefund rows for pot 3c4b024b… read back out of
# the index with the refund bytes intact.
#
# PROD IS NOT FLIPPED. Its client still predates #407, and flipping it would
# 401 the recovery-enumeration writes silently (every caller is
# fire-and-forget) — the exact money path #347 exists to close. Prod's flip
# rides the promotion, after its client carries #407.
#
# Rollback is this line: set it back to "false" (or delete it) and redeploy.
SUBMIT_ENFORCE = "true"

[[env.beta.d1_databases]]
binding = "OVERLAY_DB"
database_name = "low-overlay-db-beta"
# Committed deliberately, unlike the prod placeholder above: a D1 id is not a
# secret (it is inert without the account API token), and an uncommitted id is
# how a clean-checkout redeploy silently points at the wrong database.
database_id = "49d4ecb7-5f4d-4ba5-b149-2939ca7262c3"

[[env.beta.services]]
binding = "CHAINTRACKS"
service = "rust-chaintracks"

# The BETA app-layer (see the prod APP_LAYER binding for the why).
[[env.beta.services]]
binding = "APP_LAYER"
service = "low-app-layer-beta"

[[env.beta.queues.producers]]
queue = "low-overlay-mutations-beta"
binding = "MUTATION_QUEUE"

[[env.beta.queues.consumers]]
queue = "low-overlay-mutations-beta"
max_batch_size = 1
max_retries = 3
# S2: `wrangler queues create low-overlay-mutations-beta-dlq` before the
# beta deploy (see the prod consumer's note).
dead_letter_queue = "low-overlay-mutations-beta-dlq"

[env.beta.triggers]
crons = ["*/15 * * * *"]
