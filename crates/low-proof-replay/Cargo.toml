[package]
name = "low-proof-replay"
description = "Server-side replay of a LOW/proof/v1 transcript bundle (both hands re-derived)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
workspace = "../../workers"
publish = false

[dependencies]
# `ProvedHands` and the `BundleProver` hook this crate's `prove_bundle` fills.
overlay-discovery = { package = "bsv-overlay-discovery", version = "0.1", path = "../overlay-discovery" }
# bsv-low P1.1 part b (2026-09-02): the SAME pure crates the client's wasm
# wraps (`low-core` mental/discard math, `low-wire` signed envelopes; native +
# wasm32, no I/O, no RNG). Since 2026-10-09 (the owner's ruling 4 on
# bsv-stack-lean #42/#52) they come from crates.io as `bsv-low-core` and
# `bsv-low-wire`, published from the private bsv-low and re-pinned here by
# EXACT version at each of their releases; the libraries keep their names, so
# every `use low_core::` / `use low_wire::` reads the same. Until then they
# were PATH deps on the sister checkout (`../bsv-low`), which is why they live
# HERE and nowhere in the root workspace (bsv-low #553); a fresh clone now
# builds this workspace too.
low-core = { package = "bsv-low-core", version = "=0.1.0" }
low-wire = { package = "bsv-low-wire", version = "=0.1.0" }
serde_json.workspace = true
hex.workspace = true
# Bundles are gzip-compressed by the client past a size threshold; the pure
# Rust backend builds on wasm32-unknown-unknown.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# tests/admission.rs drives the real replay through `ProofLookupService`.
overlay-engine = { package = "bsv-overlay-engine", version = "0.1", path = "../overlay-engine" }
tokio = { workspace = true, features = ["rt", "macros"] }
