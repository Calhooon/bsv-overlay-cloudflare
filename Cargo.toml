[workspace]
members = [
    "crates/overlay-engine",
    "crates/overlay-discovery",
    "crates/overlay-cloudflare",
    "crates/low-app-layer",
    "parity-harness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-overlay-cloudflare"

[workspace.dependencies]
# BSV SDK — crates.io. `overlay` feature = types + transaction + script +
# wallet. `auth`/`http` deliberately left off; they pull reqwest/tokio-net
# which fail on wasm32.
bsv-rs = { version = "0.3", features = ["overlay"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Hex encoding
hex = "0.4"

# URL parsing
url = "2"

# Logging
tracing = "0.1"

# bsv-low #441 (2026-09-10): the session lane needs bsv-middleware-cloudflare 0.3.4
# (`session-lane`), NOT PUBLISHED yet. A git REV on the public lineage branch — never a
# path to a sibling checkout (#439's class) — until the publish, which replaces this
# block with the registry 0.3.4 (the owner's word).
[patch.crates-io]
bsv-middleware-cloudflare = { git = "https://github.com/Calhooon/bsv-middleware-cloudflare", rev = "ce00d71" }
