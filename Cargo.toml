# bsv-low #553 (2026-10-06): THIS workspace is what a consumer pins. A fresh
# clone of this repository ALONE must build `bsv-overlay-engine` and
# `bsv-overlay-discovery`, and a crate that names them by git rev must
# resolve with no `[patch]`. So no member here may carry a path dependency
# that leaves the repository. The two deployable workers and their proof replay live in a second
# workspace, `workers/Cargo.toml`, with its own `Cargo.lock`. The separation
# dates from their external path dependencies; those dependencies now resolve
# from crates.io, so both workspaces build from this repository alone.
[workspace]
members = [
    "crates/overlay-engine",
    "crates/overlay-discovery",
    "parity-harness",
    "crates/overlay-integration-tests",
]
exclude = [
    "crates/worker-build-info",
    "crates/overlay-cloudflare",
    "crates/low-app-layer",
    "crates/low-proof-replay",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
# The lowest toolchain both workspaces build on, found by trying (bsv-stack-lean
# #139): 1.87 stops in bsv-rs 0.6.0 and wasm-streams 0.6.0. The gate's `msrv`
# job checks every target at it.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-overlay-cloudflare"

# Mirrored in `workers/Cargo.toml` (a workspace cannot inherit another's
# table): change a version in both. `make ci-deploy` refuses a difference
# (`scripts/check-workspaces.sh`).
[workspace.dependencies]
# BSV SDK — crates.io. `overlay` feature = types + transaction + script +
# wallet. `auth`/`http` deliberately left off; they pull reqwest/tokio-net
# which fail on wasm32.
bsv-rs = { version = "0.6.0", features = ["overlay"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Hex encoding
hex = "0.4"

# URL parsing
url = "2"

# Logging
tracing = "0.1"

# The lint bar (bsv-stack-lean #134): every member takes this table with
# `lints.workspace = true`. The gate runs clippy with `-D warnings`, so a
# `warn` blocks a merge as well; unwrap, expect and panic are denied outside
# tests (`clippy.toml` allows them in test code). Mirrored in part in
# `workers/Cargo.toml`, whose LOW crate is not held to the last three.
# Unsafe code and missing docs (bsv-stack-lean #135): a crate with no unsafe
# forbids it at its root; each remaining unsafe item carries `// SAFETY:`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
