# bsv-low #553 (2026-10-06): THIS workspace is what a consumer pins. A fresh
# clone of this repository ALONE must build `bsv-overlay-engine` and
# `bsv-overlay-discovery`, and a crate that names them by git rev must
# resolve with no `[patch]`. So no member here may carry a path dependency
# that leaves the repository. The three crates that link LOW's private
# `bsv-low` checkout (the two deployable workers and the proof replay they
# share) are a SECOND workspace, `workers/Cargo.toml`, with its own
# `Cargo.lock`; they are excluded here because cargo loads every member's
# path dependencies, optional or not, before it builds anything.
[workspace]
members = [
    "crates/overlay-engine",
    "crates/overlay-discovery",
    "parity-harness",
]
exclude = [
    "crates/overlay-cloudflare",
    "crates/low-app-layer",
    "crates/low-proof-replay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-overlay-cloudflare"

# Mirrored in `workers/Cargo.toml` (a workspace cannot inherit another's
# table): change a version in both. `make ci-deploy` refuses a difference
# (`scripts/check-workspaces.sh`).
[workspace.dependencies]
# BSV SDK — crates.io. `overlay` feature = types + transaction + script +
# wallet. `auth`/`http` deliberately left off; they pull reqwest/tokio-net
# which fail on wasm32.
bsv-rs = { version = "0.3.35", features = ["overlay"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Hex encoding
hex = "0.4"

# URL parsing
url = "2"

# Logging
tracing = "0.1"
